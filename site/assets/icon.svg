<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Veil favicon — the shield-with-keyhole mark on its emerald tile -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#065f46"/>
      <stop offset="1" stop-color="#022c22"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#tile)"/>
  <rect width="64" height="64" rx="14" fill="url(#glow)"/>
  <rect x="1.25" y="1.25" width="61.5" height="61.5" rx="12.75" fill="none" stroke="#34d399" stroke-opacity="0.45" stroke-width="2.5"/>
  <!-- VeilMark: shield + keyhole slot, centered and scaled up -->
  <g fill="none" stroke="url(#shield)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"
     transform="translate(11.6 11.6) scale(1.7)">
    <path d="M12 22s8-3.6 8-10V5.5L12 2 4 5.5V12c0 6.4 8 10 8 10Z"/>
    <path d="M9 12h2v4"/>
  </g>
</svg>
